<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LittleLi 音樂播放器</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        h1 { color: #e62117; font-size: 24px; margin-bottom: 20px;}
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #e62117; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { background-color: #cc0000; }
        #status { margin-top: 15px; color: #555; font-size: 14px; font-weight: bold;}
        #song-title { margin-top: 15px; font-weight: bold; color: #333; font-size: 18px; }
        audio { width: 100%; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 LittleLi 音樂播放器</h1>
        <input type="text" id="yt-url" placeholder="請在此貼上 YouTube 網址...">
        <button onclick="playMusic()">解析並播放</button>
        <div id="status"></div>
        <div id="song-title"></div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        async function playMusic() {
            const urlInput = document.getElementById('yt-url').value;
            const statusText = document.getElementById('status');
            const songTitle = document.getElementById('song-title');
            const audioPlayer = document.getElementById('audio-player');

            if (!urlInput) {
                statusText.innerText = "⚠️ 請先貼上 YouTube 網址喔！";
                statusText.style.color = "red";
                return;
            }

            statusText.innerText = "⏳ 呼叫 Piped 隱形節點中，請稍候...";
            statusText.style.color = "#555";
            songTitle.innerText = "";
            audioPlayer.style.display = "none";
            audioPlayer.pause();

            const videoIdMatch = urlInput.match(/(?:youtu\.be\/|v=|\/v\/|embed\/|\?v=|\&v=)([0-9A-Za-z_-]{11})/);
            
            if (!videoIdMatch) {
                statusText.innerText = "❌ 網址格式錯誤，找不到影片 ID";
                statusText.style.color = "red";
                return;
            }

            const videoId = videoIdMatch[1];
            
            const instances = [
                "https://pipedapi.kavin.rocks",
                "https://pipedapi.smnz.de",
                "https://api.piped.projectsegfau.lt",
                "https://piped-api.lunar.icu"
            ];

            let audioUrl = null;
            let foundTitle = "🎶 音樂準備就緒";

            for (const instance of instances) {
                try {
                    const response = await fetch(`${instance}/streams/${videoId}`);
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    
                    if (data.title) {
                        foundTitle = data.title;
                    }

                    if (data.audioStreams && data.audioStreams.length > 0) {
                        const bestAudio = data.audioStreams.find(s => s.mimeType && s.mimeType.includes('mp4a')) || data.audioStreams[0];
                        audioUrl = bestAudio.url;
                        break;
                    }
                } catch (error) {
                    continue;
                }
            }

            if (audioUrl) {
                statusText.innerText = "✅ 解析成功！";
                statusText.style.color = "green";
                songTitle.innerText = foundTitle; 
                audioPlayer.src = audioUrl;
                audioPlayer.style.display = "block";
                audioPlayer.play();
            } else {
                statusText.innerText = "❌ 解析失敗：所有備用節點皆忙碌中，請稍後再試";
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
